name: fonts-test
on: workflow_dispatch
jobs:
  t:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          foreach ($f in 'impact','bahnschrift','brlnsdb','gothicb','segoeui','arial') { "$f : " + (Test-Path "C:\Windows\Fonts\$f.ttf") }
          python --version
          nproc 2>$null
          (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
